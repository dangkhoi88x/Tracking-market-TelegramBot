spring:
  application:
    name: TrackingBot
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis
    redis:
      time-to-live: 60s

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN}
    webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}

idea-chart:
  node-bin: ${IDEA_CHART_NODE_BIN:node}
  node-path: ${IDEA_CHART_NODE_PATH:}
  renderer-script: ${IDEA_CHART_RENDERER_SCRIPT:scripts/render-idea-chart.js}
  output-dir: ${IDEA_CHART_OUTPUT_DIR:${java.io.tmpdir}/trackingbot-idea-charts}

openai:
  api-key: ${OPENAI_API_KEY:}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com}
  model: ${OPENAI_MODEL:gpt-5-mini}
  max-output-tokens: ${OPENAI_MAX_OUTPUT_TOKENS:2200}
