spring:
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/tracking_bot}
    username: ${POSTGRES_USER:tracking_bot}
    password: ${POSTGRES_PASSWORD:tracking_bot_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USER:tracking_bot}
    password: ${RABBITMQ_PASSWORD:tracking_bot_password}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1s
          multiplier: 2
          max-attempts: 3
          max-interval: 10s
  flyway:
    enabled: true
    locations: classpath:db/migration
  application:
    name: TrackingBot
  data:
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false
  cache:
    type: redis
    redis:
      time-to-live: 60s

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN}
    webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}
    admin-chat-id: ${TELEGRAM_ADMIN_CHAT_ID:}

idea-chart:
  node-bin: ${IDEA_CHART_NODE_BIN:node}
  node-path: ${IDEA_CHART_NODE_PATH:}
  renderer-script: ${IDEA_CHART_RENDERER_SCRIPT:scripts/render-idea-chart.js}
  output-dir: ${IDEA_CHART_OUTPUT_DIR:${java.io.tmpdir}/trackingbot-idea-charts}

openai:
  api-key: ${OPENAI_API_KEY:}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com}
  model: ${OPENAI_MODEL:gpt-5-mini}
  max-output-tokens: ${OPENAI_MAX_OUTPUT_TOKENS:2200}

resilience4j:
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - org.springframework.web.client.RestClientException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
    instances:
      coingecko:
        base-config: default
      binanceFutures:
        max-attempts: 3
        wait-duration: 300ms
      binanceP2P:
        max-attempts: 3
        wait-duration: 500ms
      openai:
        max-attempts: 2
        wait-duration: 1s

  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        sliding-window-type: count_based
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        permitted-number-of-calls-in-half-open-state: 3
        wait-duration-in-open-state: 15s
    instances:
      coingecko:
        base-config: default
      binanceFutures:
        base-config: default
        wait-duration-in-open-state: 10s
      binanceP2P:
        base-config: default
      openai:
        register-health-indicator: true
        sliding-window-type: count_based
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 60
        permitted-number-of-calls-in-half-open-state: 2
        wait-duration-in-open-state: 30s

  ratelimiter:
    instances:
      coingecko:
        limit-for-period: 5
        limit-refresh-period: 10s
        timeout-duration: 0
      binanceFutures:
        limit-for-period: 10
        limit-refresh-period: 1s
        timeout-duration: 0
      binanceP2P:
        limit-for-period: 2
        limit-refresh-period: 5s
        timeout-duration: 0
      openai:
        limit-for-period: 2
        limit-refresh-period: 10s
        timeout-duration: 0

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    circuitbreakers:
      enabled: true
