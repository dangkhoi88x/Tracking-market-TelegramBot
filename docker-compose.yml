services:
  postgres:
    image: postgres:16
    container_name: tracking-postgres
    environment:
      POSTGRES_DB: tracking_bot
      POSTGRES_USER: tracking_bot
      POSTGRES_PASSWORD: tracking_bot_password
    ports:
      - "5432:5432"
    volumes:
      - tracking_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: tracking-redis
    ports:
      - "6379:6379"
    volumes:
      - tracking_redis_data:/data

volumes:
  tracking_postgres_data:
  tracking_redis_data: